name: build-and-push

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Lark - Build Started
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          MSG=$(printf '🔨 DVM Docker Build Started\n\n📦 Repo: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n📝 Commit: ${{ github.sha }}\n💬 Message: %s\n👤 Author: ${{ github.actor }}\n🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            "$(echo '${{ github.event.head_commit.message }}' | head -1)")
          curl -s -X POST -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$MSG" '{msg_type: "text", content: {text: $text}}')" \
            "$LARK_WEBHOOK"

  discover:
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.set-matrix.outputs.build_matrix }}
      merge-matrix: ${{ steps.set-matrix.outputs.merge_matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        name: Discover Dockerfiles
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          platforms = [
              {"platform": "linux/amd64", "suffix": "amd64", "dockerfile": "Dockerfile",      "runner": "ubuntu-latest"},
              {"platform": "linux/arm64", "suffix": "arm64", "dockerfile": "Dockerfile.arm64", "runner": "ubuntu-24.04-arm"},
          ]

          dirs = sorted({p.parent.as_posix()
                         for p in Path('.').rglob('Dockerfile')
                         if '.github' not in p.parts})

          images = [{"dir": d, "name": Path(d).name} for d in dirs]

          build_include = [
              {**img, **plat}
              for img in images
              for plat in platforms
              if (Path(img["dir"]) / plat["dockerfile"]).exists()
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"build_matrix={json.dumps({'include': build_include})}\n")
              f.write(f"merge_matrix={json.dumps({'include': images})}\n")
              f.write(f"count={len(images)}\n")
          PY

  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.build-matrix) }}
    needs: [discover]
    if: needs.discover.outputs.count != '0'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/dvm-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.merge-matrix) }}
    needs: [discover, build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate date tag
        id: date
        run: echo "tag=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dvm-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.date.outputs.tag }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ secrets.DOCKERHUB_USERNAME }}/dvm-${{ matrix.name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/dvm-${{ matrix.name }}:latest

  notify-success:
    runs-on: ubuntu-latest
    needs: [discover, build, merge]
    if: success()
    steps:
      - name: Notify Lark - Build Succeeded
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          MSG=$(printf '✅ DVM Docker Build Succeeded\n\n📦 Repo: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n📝 Commit: ${{ github.sha }}\n💬 Message: %s\n👤 Author: ${{ github.actor }}\n🏷️ Images: ${{ needs.discover.outputs.count }} image(s) built & pushed\n🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            "$(echo '${{ github.event.head_commit.message }}' | head -1)")
          curl -s -X POST -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$MSG" '{msg_type: "text", content: {text: $text}}')" \
            "$LARK_WEBHOOK"

  notify-failure:
    runs-on: ubuntu-latest
    needs: [discover, build, merge]
    if: failure()
    steps:
      - name: Notify Lark - Build Failed
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          MSG=$(printf '❌ DVM Docker Build Failed\n\n📦 Repo: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n📝 Commit: ${{ github.sha }}\n💬 Message: %s\n👤 Author: ${{ github.actor }}\n⚠️ Please check the workflow logs for details\n🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            "$(echo '${{ github.event.head_commit.message }}' | head -1)")
          curl -s -X POST -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$MSG" '{msg_type: "text", content: {text: $text}}')" \
            "$LARK_WEBHOOK"
