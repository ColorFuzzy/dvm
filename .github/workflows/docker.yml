name: build-and-push

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    needs: [discover]
    if: needs.discover.outputs.count != '0'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dvm-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        name: Discover Dockerfiles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dirs = []
          for p in Path('.').rglob('Dockerfile'):
            if '.github' in p.parts:
              continue
            dirs.append(p.parent.as_posix())

          dirs = sorted(set(dirs))
          include = [{"dir": d, "name": Path(d).name} for d in dirs]
          matrix = json.dumps({"include": include})
          print("matrix=", matrix)
          output = __import__("os").environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as f:
            f.write(f"matrix={matrix}\n")
            f.write(f"count={len(include)}\n")
          PY
